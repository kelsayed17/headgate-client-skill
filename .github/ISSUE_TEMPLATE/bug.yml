name: Bug report
description: headgate-verify reports a correct client, misses a broken one, or the skill says something it does not do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting. For a security problem (the checker executing the code it reads, a skill instruction
        that leaks a credential), do not open an issue: use private vulnerability reporting instead (see SECURITY.md).
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - A correct client is reported (false positive)
        - A broken client passes (false negative)
        - The skill or a reference says something the checker does not do
        - The checker crashes or exits with the wrong code
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The rule id and the finding as printed, if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >
        The smallest client.py (and models.py or docs_paths.json, if they matter) that shows it, and the
        headgate-verify command you ran. Remove any credentials.
      render: python
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `uv pip list | grep -iE "headgate|ast-grep"` and `python --version`.
      render: text
    validations:
      required: true
