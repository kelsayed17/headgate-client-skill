# An order-executing or otherwise non-idempotent write names its retry policy. headgate re-sends a POST or PATCH only
# when it can tell nothing was processed, but a client built with a policy that re-sends every method, or a call that
# reaches a host without idempotency keys, can send an order twice. Naming `retry=` at the call makes the choice
# visible where the write is.
#
# Scope: every module of the package.
#
# Reported: a call `self.post(...)`, `self.put(...)`, `self.patch(...)` or `self.delete(...)` (the callee
# parenthesised or not) with no `retry=` keyword, anywhere inside a def (sync or async, at any nesting, through nested
# defs and lambdas) whose name contains one of the project's write-name fragments (`Config.write_name_fragments`,
# `[tool.headgate-verify] write-name-fragments`; by default order, orders, transfer, withdraw, payment, multileg,
# close_position, close_all_positions, close_option_position, liquidat, exercise_option). A def whose
# name STARTS with `cancel_` or `preview_`, or is exactly `cancel` or `preview`, and does not contain `replace`, is not
# executing: a preview sends nothing that executes, and a re-sent cancel is the one write you want to land. A name
# that only contains the word (`place_one_cancels_other_order`, `place_order_after_preview`) or a cancel-and-replace
# (`cancel_and_replace_order`, which submits a new order) is executing. `retry=` with ANY value satisfies the rule: a
# literal, or a module-level policy (`retry=ORDER_RETRY`, which client-method-shape accepts as a bare UPPER_CASE name
# the module binds, R10); `**kwargs` carrying it does not.
#
# PORTED from the source rule of the same name. Changed: the source's fixed list of executing names (place_order,
# submit_order, close_position, liquidat, ...) is the configured fragment list; since the default fragment `order`
# also matches `cancel_order`, which the source's list never named, a name starting with `cancel_` joins one starting
# with `preview_` as not executing (anchored, and never a cancel-and-replace; the source's `preview` was unanchored).
#
# A method named in `post-reads` (`Config.post_reads`) is a read by POST, so a fragment in its name
# (`search_orders`, `estimate_multileg_margin`) does not make it a write.
#
# DISCLOSED: a write issued through a helper the executing method calls (`self._submit(...)` whose own name holds no
# fragment) is not followed; a fragment matches anywhere in a name (`order` in `border_crossings`).
id: client-order-writes-name-retry
language: python
severity: error
message: an order-executing or non-idempotent write names retry= (a re-sent order is a second order)
note: >-
  Pass `retry=False`, or a module-level policy (`retry=ORDER_RETRY`). A method that is idempotent under replay but whose name holds a
  fragment takes an allow comment with its reason; a project's fragments are `write-name-fragments` in
  `[tool.headgate-verify]`.
utils:
  self-write:
    kind: attribute
    all:
      - has: {field: object, regex: '^self$'}
      - has: {field: attribute, regex: '^(post|put|patch|delete)$'}
rule:
  kind: call
  has:
    field: function
    any:
      - matches: self-write
      - {kind: parenthesized_expression, has: {stopBy: {not: {kind: parenthesized_expression}}, matches: self-write}}
  not: {has: {field: arguments, has: {kind: keyword_argument, has: {field: name, regex: '^retry$'}}}}
  inside:
    kind: function_definition
    stopBy: end
    has:
      field: name
      regex: '{{config.write_name_fragments}}'
      all:
        # A cancel or a preview by name: starts with `cancel_`/`preview_` or is exactly `cancel`/`preview`, and is not
        # a cancel-and-replace.
        - not: {regex: '^(cancel|preview)(_|$)', not: {regex: 'replace'}}
        # A method the project declares a read by POST (`post-reads`): a re-sent read is harmless.
        - not: {regex: '^(?:{{config.post_reads}})$'}
