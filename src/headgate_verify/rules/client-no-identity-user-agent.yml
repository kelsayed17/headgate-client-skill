# A self-identifying User-Agent is never a source literal.
# The User-Agent (product token plus contact) is deployment configuration: the code that builds the client composes
# it and passes it in (`client-user-agent-has-no-default` keeps the parameter required), so neither the token nor the
# contact is a literal in a client package. The browser-spoof half is `client-browser-user-agent-only-where-allowed`.
#
# Reported: a string literal that is not a docstring and holds a contact clause (`(+mailto:`, `(+http://`,
# `(+https://`, spaces allowed after the `+`) or a product token: `name/<digit>` (any case: `ShopSync/1.4`,
# `shop-sync/1.4`) that starts the literal, or follows a `;` as in `Mozilla/5.0 (compatible; Name/1.0)`. A literal that
# starts with a browser token (`Mozilla`, `AppleWebKit`, `Chrome`, `Chromium`, `Safari`, `Gecko`, `Firefox`, `Version`,
# `Edg`, `Edge`, `Opera`, `HTTP`, any case) is not a product token. Literals are read as in
# `client-no-placeholder-contact`: each literal part of a plain, bytes, f- or t-string, an f-string format spec, and an
# implicit concatenation JOINED (the token with an optional break between every two characters), unless the token is
# in an interpolation's code. A later part of a concatenation is not read on its own.
#
# DECISION: a bare name with no version (`{"User-Agent": "acme-client"}`) is NOT reported. Without the `/<digit>` it
# cannot be told from a label, a header value or a package name, and every guess would be a false positive; the
# contact clause and the versioned token are the two shapes that identify a caller on the wire.
#
# Exempt: docstrings, defined as in `client-no-placeholder-contact`.
#
# DISCLOSED: an escape-encoded character is read as written. A product token in the MIDDLE of a literal, with no `;`
# before it, is not read (`"x Name/1.0"`): browser strings end in `Chrome/150.0` and `Safari/537.36`, and ast-grep's
# regex has no lookbehind to tell them apart. A lowercase path whose second segment starts with a digit
# (`"v1/2024"`) reads as a token.
id: client-no-identity-user-agent
language: python
severity: error
message: a self-identifying User-Agent is passed in, never written as a literal
note: >-
  The code that builds the client composes the identity (product token and contact) and passes it as `user_agent`.
files:
  - '*.py'
utils:
  token:
    any:
      - regex: '\(\+\s*(mailto:|https?://)'
      - regex: ';\s*[A-Za-z][A-Za-z0-9_.\-]*/\d'
      # the start of a literal: not a later part of an implicit concatenation (read joined below)
      - kind: string_content
        regex: '^[A-Za-z][A-Za-z0-9_.\-]*/\d'
        not:
          any:
            - {regex: '(?i)^(Mozilla|AppleWebKit|Chrome|Chromium|Safari|Gecko|Firefox|Version|Edg|Edge|Opera|HTTP)/'}
            - {inside: {kind: string, follows: {stopBy: end, kind: string}, inside: {kind: concatenated_string}}}
      - kind: format_specifier
        regex: '^:?[A-Za-z][A-Za-z0-9_.\-]*/\d'
        not: {regex: '(?i)^(Mozilla|AppleWebKit|Chrome|Chromium|Safari|Gecko|Firefox|Version|Edg|Edge|Opera|HTTP)/'}
  # A literal with no f/t prefix (a docstring candidate): one string, or a concatenation of them.
  plain-literal:
    any:
      - {kind: string, has: {kind: string_start, not: {regex: '[fFtT]'}}}
      - {kind: concatenated_string, not: {has: {kind: string, has: {kind: string_start, regex: '[fFtT]'}}}}
  docstring:
    kind: expression_statement
    nthChild: {position: 1, ofRule: {not: {kind: comment}}}
    inside:
      any:
        - {kind: module}
        - {kind: block, inside: {any: [{kind: class_definition}, {kind: function_definition}]}}
    has:
      any:
        - matches: plain-literal
        - {kind: parenthesized_expression, has: {stopBy: {not: {kind: parenthesized_expression}}, matches: plain-literal}}
    not: {has: {nthChild: 2}}
rule:
  not: {inside: {stopBy: end, matches: docstring}}
  any:
    - {kind: string_content, matches: token}
    - {kind: format_specifier, matches: token}
    - kind: concatenated_string
