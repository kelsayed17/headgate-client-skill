# A transport is extended by SUBCLASSING it, never by wrapping an instance of it.
#
# headgate takes a transport as `HttpOptions(transport=...)`. A class that stores another transport it was handed and
# forwards `handle_async_request` to it (`self._inner.handle_async_request(request)`) is a wrapper: it must forward
# `aclose` too, it hides the wrapped transport's own attributes, and what it does not forward is lost. Subclass the
# transport instead and call `super().handle_async_request(request)`, so everything the base class does carries over.
#
# Scope: every module of the package.
#
# Reported: inside a method `handle_async_request` of a class, a call `self.<attr>.handle_async_request(...)`
# (awaited or not), however `<attr>` was set: from an `__init__` parameter, a default fallback (`inner or Default()`),
# a dataclass or annotated field, or a transport the class builds itself. The same call through a local alias of such
# an attribute in the same method (`inner = self._inner; await inner.handle_async_request(...)`) is reported too.
# Nested classes and classes defined in functions are read like any other. `super().handle_async_request(...)` is not
# reported.
#
# DISCLOSED: a wrapped transport reached by any other route is not read: a local alias bound through a call or
# unpacking (`inner = get_inner(self)`, `(inner,) = ...`), an alias made in another method, a transport held in a
# module global or a container (`self._chain[0].handle_async_request(...)`), a forwarding helper method of the same
# class, and a call on `self.<attr>` outside a method named `handle_async_request`.
#
# NEW in this tool (anti-goal 6 of the design).
id: client-transport-subclassed-not-wrapped
language: python
severity: error
message: a transport wraps another one it was handed; subclass it and call super().handle_async_request instead
note: >-
  Write `class Paced(httpx2.AsyncHTTPTransport)` with `async def handle_async_request(self, request): ...; return
  await super().handle_async_request(request)`, so the base transport's behaviour is inherited, not re-forwarded.
files:
  - '*.py'
rule:
  kind: call
  inside:
    stopBy: end
    kind: function_definition
    has: {field: name, regex: '^handle_async_request$'}
    inside: {kind: block, inside: {kind: class_definition}}
  any:
    - pattern: self.$ATTR.handle_async_request($$$ARGS)
    - all:
        - pattern: $ALIAS.handle_async_request($$$ARGS)
        - inside:
            stopBy: end
            kind: function_definition
            has:
              stopBy: end
              kind: assignment
              all:
                - has: {field: left, pattern: $ALIAS}
                - has: {field: right, pattern: self.$ATTR}
