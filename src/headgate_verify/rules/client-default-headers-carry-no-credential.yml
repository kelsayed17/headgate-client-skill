# Credentials ride `auth=`, never the client's default headers.
# headgate's auth classes (`StaticHeaderAuth`, `QueryParamAuth`, `CachedTokenAuth`, `BearerAuth`) give per-request
# credential injection one home with one merge semantic (an explicit caller header wins), and headgate withholds an
# `auth=` credential from an origin that is not trusted (`SecurityOptions`), which a header set by hand does not get.
# headgate's spelling of the client's default headers is `http=HttpOptions(headers=...)`.
#
# Reported: a `headers=` keyword of a call to `HttpOptions` (bare or as an attribute, `headgate.HttpOptions`) whose
# value holds, at any depth (a nested dict, a `{**base, ...}` merge, a conditional, a lambda, a comprehension), a dict
# key that NAMES a credential: one containing `authorization`, `token`, `api-key`/`api_key`/`apikey`, `secret` or
# `credential`, any case. The name match is loose on purpose: a false positive is a header that should go through
# the seam anyway. A key is any expression holding such a literal; a literal is read as in
# `client-no-placeholder-contact` (each part of a plain, f- or t-string, and an interpolation-free implicit
# concatenation JOINED); a `dict(Authorization=...)` keyword counts as a key. A name anywhere in the value
# (`headers=_HEADERS`, `{**_AUTH}`, a class attribute read as `self._HEADERS`), an attribute (`self._headers`, bound in
# `__init__`) or a subscript (`_BY_ENV["prod"]`) is resolved one hop, to any assignment or augmented assignment
# (`_HEADERS |= {...}`) of that name in the module.
#
# DISCLOSED: a key that is a name (`{_AUTH_HEADER: key}`) is not read; a value built by a call
# (`headers=self._headers()`) or reached through two names is not followed; an `HttpOptions` built through
# `dataclasses.replace(opts, headers=...)` or a `**kwargs` dict is not read; nor are a per-call `headers=` and an
# `Expect(..., headers=...)` declaration.
id: client-default-headers-carry-no-credential
language: python
severity: error
message: credentials ride auth=, never HttpOptions(headers=)
note: >-
  Credentials go through auth= (headgate: StaticHeaderAuth / QueryParamAuth / CachedTokenAuth, or an httpx2.Auth of the
  client's own), which owns the setdefault merge and the trusted-origin check. StaticHeaderAuth({}) is the idiomatic
  "no key configured" value; no if-branch is needed.
files:
  - '*.py'
utils:
  credential-name: {regex: '(?i)authorization|token|api[-_]?key|secret|credential'}
  credential-literal:
    any:
      - {kind: string, has: {kind: string_content, matches: credential-name}}
      - kind: concatenated_string
        not: {has: {stopBy: end, kind: interpolation}}
        regex: '(?i)(?:a(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?u(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?t(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?h(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?o(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?r(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?i(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?z(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?a(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?t(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?i(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?o(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?n|t(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?o(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?k(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?e(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?n|a(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?p(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?i(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?[-_]?(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?k(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?e(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?y|s(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?e(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?c(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?r(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?e(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?t|c(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?r(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?e(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?d(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?e(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?n(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?t(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?i(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?a(?:["'']{1,3}(?:\s|\\|#.*)*[a-zA-Z]{0,2}["'']{1,3})?l)'
  # A pair whose key holds a credential literal (a dict literal or a dict comprehension's body), or `dict(<name>=...)`.
  credential-entry:
    any:
      - kind: pair
        has:
          field: key
          any: [{matches: credential-literal}, {has: {stopBy: end, matches: credential-literal}}]
      - kind: keyword_argument
        has: {field: name, matches: credential-name}
        inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^dict$'}}}
  # A name or attribute bound, anywhere in the module, to a value holding a credential entry.
  resolves-to-credential:
    all:
      - {any: [{kind: identifier}, {kind: attribute}, {kind: subscript}], pattern: $NAME}
      - inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            any: [{kind: assignment}, {kind: augmented_assignment}]
            all:
              - has: {field: left, pattern: $NAME}
              - has: {field: right, has: {stopBy: end, matches: credential-entry}}
rule:
  kind: keyword_argument
  all:
    - has: {field: name, regex: '^headers$'}
    - inside:
        kind: argument_list
        inside:
          kind: call
          has:
            field: function
            any:
              - {kind: identifier, regex: '^HttpOptions$'}
              - {kind: attribute, has: {field: attribute, regex: '^HttpOptions$'}}
    - has:
        field: value
        any:
          - {has: {stopBy: end, matches: credential-entry}}
          - matches: resolves-to-credential
          - {has: {stopBy: end, matches: resolves-to-credential}}
